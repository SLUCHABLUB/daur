[package]
name = "daur"
version = "0.1.0"

authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Public dependencies.

anyhow = "1.0.98"
arcstr = "1.2.0"
enum-iterator = "2.3.0"
indexmap = { version = "2.9.0", features = ["serde"] }
mitsein = { version = "0.9.0", features = ["indexmap"] }
serde = { version = "1.0.228", features = ["derive"] }
symphonia = { version = "0.5.4", features = ["all"] }

# Non-public dependencies.

bon = "3.9"
bytemuck = { version = "1.24", features = ["derive"] }
const-str = "1.1"
crossbeam = "0.8.4"
derive_more = { version = "2.0.1", features = ["debug"] }
executors = "0.10.0"
getset = "0.1.7"
hound = "3.5.1"
itertools = "0.14.0"
non-zero = "0.2.0"
num = "0.4.3"
parking_lot = "0.12.3"
remain = "0.2.16"
rodio = "0.22.2"
rubato = "0.16.2"
saturating_cast = "0.1.0"
toml = "1.1"
thiserror = "2.0"
enumset = { version = "1.1", features = ["serde"] }
